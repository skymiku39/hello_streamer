name: Build and Release Desktop Apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  UV_VERSION: "0.12.20"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: |
          uv --version
          uv sync --locked --extra dev
          uv tree --locked --extra dev --depth 2

      - name: Ruff
        run: uv run ruff check .

      - name: Compile Python
        run: uv run python -m compileall -f stream_monitor build.py

      - name: Pytest
        run: uv run pytest -q

      - name: Build Executable
        run: uv run python build.py

      - name: Package Windows onedir zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          if (-not (Test-Path -LiteralPath "dist/HelloStreamer/HelloStreamer.exe")) {
            throw "Expected onedir exe at dist/HelloStreamer/HelloStreamer.exe"
          }
          Compress-Archive -Path "dist/HelloStreamer" -DestinationPath "release/HelloStreamer-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release/*

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x64
            platform: linux/amd64
          - artifact: linux-arm64
            platform: linux/arm64

    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux executable in Debian Bookworm
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e UV_VERSION="${{ env.UV_VERSION }}" \
            debian:bookworm \
            bash -c '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                curl \
                ca-certificates \
                python3 \
                python3-venv \
                python3-tk \
                python3-gi \
                python3-gi-cairo \
                libpython3.11 \
                libgirepository1.0-dev \
                gir1.2-gtk-3.0 \
                gir1.2-ayatanaappindicator3-0.1 \
                libnotify-bin \
                fonts-dejavu-core \
                binutils \
                gcc \
                libc-dev \
                file
              rm -rf .venv build dist
              # Install uv CLI into an isolated tool prefix (not the app venv).
              curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv --version
              # Keep Debian GTK / system-site packages visible to the build venv.
              uv venv --python python3 --system-site-packages
              uv sync --locked --extra dev
              uv tree --locked --extra dev --depth 2
              . .venv/bin/activate
              python -m ruff check .
              python -m compileall -f stream_monitor build.py
              python -m pytest -q
              python build.py
              echo "=== Build output ==="
              python build.py --validate-linux-onedir dist/HelloStreamer
              test -x dist/HelloStreamer/HelloStreamer
              test -s dist/HelloStreamer/HelloStreamer
              file dist/HelloStreamer/HelloStreamer
              ls -la dist/HelloStreamer
              echo "=== Frozen Linux smoke check ==="
              dist/HelloStreamer/HelloStreamer --self-check
            '

      - name: Fix file ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Package Linux executable
        run: |
          set -euo pipefail
          bundle="dist/HelloStreamer"
          exe="${bundle}/HelloStreamer"
          internal="${bundle}/_internal"
          if [[ ! -f "$exe" || ! -s "$exe" ]]; then
            echo "Linux onedir bundle incomplete; missing or empty executable: $exe" >&2
            exit 1
          fi
          if [[ ! -x "$exe" ]]; then
            echo "Linux onedir bundle incomplete; not executable: $exe" >&2
            exit 1
          fi
          if [[ ! -d "$internal" ]]; then
            echo "Linux onedir bundle incomplete; missing _internal: $internal" >&2
            exit 1
          fi
          if [[ -z "$(ls -A "$internal")" ]]; then
            echo "Linux onedir bundle incomplete; empty _internal: $internal" >&2
            exit 1
          fi
          mkdir -p release
          tar -czf "release/HelloStreamer-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz" -C dist HelloStreamer

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release/*

  release:
    needs: [build-windows, build-linux]
    if: |
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: List release files
        run: ls -lh release/

      - name: Extract current version release notes
        run: awk 'BEGIN{keep=1} /^---$/{keep=0} keep{print}' RELEASE_NOTES.md > release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
